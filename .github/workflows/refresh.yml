# Day 1 of the daily loop: detect, build, gate, stage, and publish a preview.
#
# Design and the numbers behind it: docs/08-operations/2026-10-30-edgar-refresh-architecture.md
# Decisions: ADR-0010 (executor, cadence, staging) and ADR-0011 (two-day promotion,
# triage log, retention).
#
# This workflow may write only *non-production* surfaces:
#   - the staged release under `staging/latest/release.json` in R2;
#   - the unrecoverable-submission log under `triage/` in R2;
#   - the preview Worker (`unpackfund-preview`), which owns no domain.
# It never writes `latest/release.json` and never deploys the `unpackfund` Worker.
# `promote.yml` does those, one day later, only if the checks recorded here pass.
#
# Cost: public-repo standard runners are free; R2 Class A operations are the only
# metered resource (one staged publish = 14,239 puts of the free 1,000,000/month).

name: refresh

on:
  workflow_dispatch:
    inputs:
      days:
        description: "complete filing days to scan (1 = yesterday alone, 7 = catch up a week)"
        default: "3"
      force:
        description: "build even when detection finds no new filings"
        type: boolean
        default: false
  schedule:
    # 06:30 UTC = 02:30 ET, about 4.5 hours after EDGAR writes the previous day's
    # index (observed 22:01 ET). GitHub's cron is best-effort and can start hours
    # late; the margin is there so lateness is not a correctness problem, and the
    # 25-hour gap to promote.yml is what makes "promote the previous day" true.
    - cron: "30 6 * * *"

permissions:
  contents: read

# One data release at a time: two runs writing the pointer concurrently would leave
# the site serving whichever finished last. Queue instead of cancelling — a
# cancelled publish is a wasted 26-minute upload.
concurrency:
  group: data-refresh
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  # The pipeline refuses to make a request without a declared contact.
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
  UNPACKFUND_CACHE: data/cache
  # A GitHub-hosted runner shares its egress IP with every other job on that host, so
  # SEC's per-IP cap (~10 req/s) is not ours to spend. 5/s leaves headroom and the extra
  # minutes are cheaper than a 429 that kills a 55-minute build.
  SEC_REQUESTS_PER_SECOND: "5"
  # Pinned: `npx wrangler@4` resolved to a version that did not exist on 2026-10-29.
  WRANGLER: "wrangler@4.155.0"

jobs:
  detect:
    name: detect new filings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      new_filings: ${{ steps.detect.outputs.new_filings }}
      superseded: ${{ steps.detect.outputs.superseded }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./pipeline

      - name: Poll EDGAR's daily index
        id: detect
        working-directory: pipeline
        run: |
          set -euo pipefail
          DAYS="${{ inputs.days || '3' }}"
          python -m pipeline.refresh detect --days "$DAYS" --peek \
            --json ../artifacts/detect/delta.json
          COUNT=$(python -c "import json;print(json.load(open('../artifacts/detect/delta.json'))['change']['new_filings'])")
          SUPERSEDED=$(python -c "import json;d=json.load(open('../artifacts/detect/delta.json'));print(d.get('peek',{}).get('published_funds_affected',0))")
          echo "new_filings=$COUNT" >> "$GITHUB_OUTPUT"
          echo "superseded=$SUPERSEDED" >> "$GITHUB_OUTPUT"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Detection"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| filing days scanned | ${{ inputs.days || '3' }} |"
            echo "| N-PORT filings in the published universe | ${{ steps.detect.outputs.new_filings }} |"
            echo "| published funds superseded | ${{ steps.detect.outputs.superseded }} |"
            echo
            echo '```json'
            head -c 4000 artifacts/detect/delta.json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta
          path: artifacts/detect/delta.json
          retention-days: 14
          if-no-files-found: ignore

  stage:
    name: build, gate, stage, preview
    needs: detect
    if: needs.detect.outputs.new_filings != '0' || inputs.force
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      release: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./pipeline

      # No actions/cache for the byte cache: a cold cache is ~6 GB of immutable
      # EDGAR documents, which does not fit the 10 GB repo cache alongside anything
      # else and would be evicted between runs anyway. Phase 2 seeds it from the R2
      # raw prefix instead.
      - name: Build the wide release
        working-directory: pipeline
        run: |
          python -m pipeline.build --universe all \
            --out ../artifacts --workers 8 --progress-every 1000

      - name: Record the release id
        id: release
        run: |
          RELEASE_DIR=$(ls -d artifacts/releases/*/ | tail -1)
          ID=$(basename "$RELEASE_DIR")
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "dir=$RELEASE_DIR" >> "$GITHUB_OUTPUT"

      - name: Validate (schema, sums, hashes — the blocking gate)
        working-directory: pipeline
        run: |
          python -m pipeline.validate --release "../artifacts/releases/${{ steps.release.outputs.id }}"

      - name: Review what changed (deterministic rules, blocks on a blocker)
        working-directory: pipeline
        run: |
          set -euo pipefail
          PREV=$(ls -d ../artifacts/releases/*/ | tail -2 | head -1 | xargs -r basename || true)
          ARGS=(--release "../artifacts/releases/${{ steps.release.outputs.id }}"
                --json "../artifacts/review/${{ steps.release.outputs.id }}.json"
                --fail-on blocker)
          if [ -n "$PREV" ] && [ "$PREV" != "${{ steps.release.outputs.id }}" ]; then
            ARGS+=(--parent "../artifacts/releases/$PREV")
          fi
          python -m pipeline.review "${ARGS[@]}"

      # A log, not a gate: whatever could not be published is recorded here so it can
      # be triaged later, instead of scrolling out of a 300-minute job log.
      - name: Log unrecoverable submissions
        working-directory: pipeline
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python -m pipeline.triage \
            --release "../artifacts/releases/${{ steps.release.outputs.id }}" \
            --out ../artifacts --upload

      - name: Stage the release (never live)
        working-directory: pipeline
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          # No --allow-live: `release upload` refuses to touch latest/ without it, and
          # this workflow does not pass it. Promotion is promote.yml's job, tomorrow.
          python -m pipeline.release upload \
            --release "../artifacts/releases/${{ steps.release.outputs.id }}"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the site
        run: pnpm install --frozen-lockfile

      # Two builds, and the difference is one baked-in string: the pointer the browser
      # reads. `NEXT_PUBLIC_POINTER_PATH` is compiled into the chunks, so one build
      # cannot serve both. Production must read `latest/release.json` (a staging default
      # in a production build would let a later staging upload move the live site — see
      # web/lib/data.ts), and the preview must read `staging/latest/release.json` or it
      # would review yesterday's live data against today's pages.
      #
      # The Next export starts empty every run, so every page is written here; the
      # daily *upload* is still incremental because Cloudflare's asset manifest skips
      # files whose hash it already has. `pnpm verify` deliberately does not do this.
      #
      # `python -m`, not `pnpm pages:funds`: the pnpm wrapper pins the local venv
      # interpreter and appends arguments inside `pipeline/`, neither of which is true
      # on a runner. `pip install ./pipeline` puts the same module on the path here.
      - name: Build the production site with the fund pages for this release
        run: |
          pnpm build
          python -m pipeline.fund_pages \
            --release "artifacts/releases/${{ steps.release.outputs.id }}" \
            --out web/out

      # The exact bytes that ship tomorrow. `promote.yml` deploys this artifact rather
      # than rebuilding, so a promotion cannot publish pages nobody looked at.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/out
          retention-days: 3
          if-no-files-found: error

      - name: Build the preview site against the staged pointer
        env:
          NEXT_PUBLIC_POINTER_PATH: staging/latest/release.json
        run: |
          pnpm build
          python -m pipeline.fund_pages \
            --release "artifacts/releases/${{ steps.release.outputs.id }}" \
            --out web/out
          # Prove the baked pointer: a preview reading the live pointer looks plausible
          # and reviews the wrong release.
          test "$(grep -rl 'staging/latest/release.json' web/out/_next/static/chunks | wc -l | tr -d ' ')" -gt 0

      # The one human-reviewable surface: a Worker with no domain of its own.
      - name: Publish the preview
        env:
          # wrangler's env var name is CLOUDFLARE_API_TOKEN; the repository secret is
          # CLOUDFLARE_ACCOUNT_API_TOKEN (set 2026-10-28), so map one onto the other rather
          # than asking for the same credential under a second name.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCOUNT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes ${{ env.WRANGLER }} deploy --config wrangler.preview.jsonc

      - name: Smoke the preview
        run: |
          set -euo pipefail
          BASE="https://unpackfund-preview.mitchell-layton.workers.dev"
          for PATHNAME in / /funds/ /x/; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 "$BASE$PATHNAME")
            echo "$PATHNAME -> $CODE"
            test "$CODE" = "200"
          done

      # The site artifact was uploaded before the preview rebuild on purpose: the
      # artifact must be the *production* pointer build, and this step overwrote
      # `web/out` with the staging-pointer one.
      - name: Summarise
        if: always()
        run: |
          {
            echo "### Staged release ${{ steps.release.outputs.id }}"
            echo
            for FILE in build-summary.json upload-report.json; do
              if [ -f "artifacts/releases/${{ steps.release.outputs.id }}/$FILE" ]; then
                echo "**$FILE**"
                echo '```json'
                head -c 3000 "artifacts/releases/${{ steps.release.outputs.id }}/$FILE" || true
                echo '```'
              fi
            done
            if [ -f "artifacts/review/${{ steps.release.outputs.id }}.json" ]; then
              echo "**review**"
              echo '```json'
              python -c "import json;d=json.load(open('artifacts/review/${{ steps.release.outputs.id }}.json'));print(json.dumps({k:d[k] for k in ('counts','rules') if k in d}, indent=2))"
              echo '```'
            fi
            if [ -f artifacts/triage/index.json ]; then
              echo "**triage**"
              echo '```json'
              head -c 2000 artifacts/triage/index.json || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-reports
          path: |
            artifacts/releases/*/build-summary.json
            artifacts/releases/*/upload-report.json
            artifacts/review/
            artifacts/triage/
          retention-days: 14
          if-no-files-found: ignore
