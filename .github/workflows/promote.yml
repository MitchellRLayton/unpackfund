# Day 2 of the daily loop: promote yesterday's staged release to production.
#
# Why a second run and not the end of the first: the staged release spends a day on the
# preview Worker and in `staging/`, which is a window for the checks to run twice, for a
# human to look, and for a bad pull to be caught before it is what the site serves.
# The gate that matters is the checks, not the delay.
#
# Order, and it is deliberate (cloudflare-workers-r2-deploy §5):
#   1. the data pointer moves first — the app reads it, and the pages discover their
#      numbers through it;
#   2. then the Worker, in two pieces: the *app* is rebuilt from this run's checkout, and
#      the *fund pages* are taken from the artifact day 1 built, so a promotion cannot
#      publish pages nobody reviewed — and cannot publish code older than `main` either;
#   3. retention is *not* step 3 here any more: the prune moved to `prune.yml`, which
#      runs on this workflow's success (and daily as a safety net). It used to be a step
#      below, with `continue-on-error: true`, and that combination hid a ten-day backlog:
#      the prune refused on every run and the job stayed green. It cannot simply fail
#      here, because `deploy-site.yml` only runs when this workflow concludes success.
# A failure at (2) leaves fresh data with pages one day old, which is visible and
# recoverable; the reverse (new pages, old data) would show a fund page the app disagrees
# with.
#
# **Why the app is rebuilt here (fixed 2026-11-02).** The artifact's `web/out` is a whole
# site compiled by day 1, whose checkout is whatever `main` was when that run started — up
# to a day older than the code a merge published, and in the observed case 79 minutes
# older. Deploying it whole therefore republished an app bundle from before two merges:
# at 18:39 on 2026-11-02 a promotion put a pre-VT build over production, and the column
# added at 18:21 disappeared until the promote→deploy-site hand-off rebuilt it at 18:45.
# The artifact is trustworthy for what day 1 *generated* (the 9k fund pages, their
# stylesheet, sitemap, robots); it is not a source of truth for code. So: build the app
# from this checkout, copy the generated pages over it, deploy the pair.
#
# Refuses, rather than guesses, when: there is no staged candidate, the candidate is
# already live, the candidate is more than 3 days old (day 1 has been failing), or the
# artifact day 1 produced is missing.

name: promote

on:
  workflow_dispatch:
    inputs:
      release:
        description: "release id to promote (default: whatever staging/latest names)"
        default: ""
      allow_downgrade:
        description: "permit promoting an OLDER release id — this is the rollback path"
        type: boolean
        default: false
      skip_deploy:
        description: "move the data pointer only, leave the site on its current version"
        type: boolean
        default: false
  # Live since 2026-10-30: the first promotion was watched by hand (`workflow_dispatch`),
  # went green, and only then was this schedule switched on.
  #
  # **05:45 UTC, before the 06:30 refresh — not after it.** The two files share the
  # `data-refresh` concurrency group, so a promotion cannot overlap a refresh, and the
  # order decides *what* gets promoted: `staging/latest/release.json` is a single pointer
  # that the morning refresh overwrites at its end. A promotion scheduled after the
  # refresh would therefore promote a release built an hour earlier and lose the day of
  # soak entirely. Running first pins the candidate to what yesterday's run staged and
  # verified.
  #
  # Residual risk, accepted: GitHub's cron is best-effort, so a promotion that starts
  # after 06:30 waits for the refresh and then promotes the newer release. That shortens
  # the soak to minutes; it does not promote anything the gates failed, because the
  # pointer is only written after every object verified.
  schedule:
    - cron: "45 5 * * *"

permissions:
  contents: read
  # The site artifact is uploaded by *yesterday's* refresh run, so this workflow has to
  # list and download artifacts across runs. Without it `download-artifact` silently finds
  # nothing and the promotion would move the pointer while the site stayed a day old.
  actions: read

# Same group as refresh: never let a promotion overlap a build.
concurrency:
  group: data-refresh
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  WRANGLER: "wrangler@4.155.0"
  DATA_HOST: "https://data.unpackfund.com"
  PREVIEW_HOST: "https://unpackfund-preview.mitchell-layton.workers.dev"
  SITE_HOST: "https://unpackfund.com"

jobs:
  promote:
    name: promote the staged release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Node is here only to rebuild the app (see the header); the pointer move and the
      # promotion are Python (the prune left for `prune.yml` on 2026-11-10). Same three
      # setup steps `deploy-site.yml` uses, so the two publishers cannot drift on the
      # toolchain.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./pipeline

      # curl, not urllib: the data host answers Python-urllib with 403 (edge rule), and a
      # cached 404 on a pointer is why the query string is there.
      - name: Resolve what to promote
        id: resolve
        run: |
          set -euo pipefail
          probe() { curl -fsS --retry 3 --retry-delay 2 "$1?probe=$(date +%s)"; }
          STAGED="${{ inputs.release }}"
          if [ -z "$STAGED" ]; then
            STAGED=$(probe "$DATA_HOST/staging/latest/release.json" | python -c "import json,sys;print(json.load(sys.stdin)['as_of'])")
          fi
          LIVE=$(probe "$DATA_HOST/latest/release.json" 2>/dev/null | python -c "import json,sys;print(json.load(sys.stdin).get('as_of',''))" || echo "")
          echo "staged=$STAGED" >> "$GITHUB_OUTPUT"
          echo "live=$LIVE" >> "$GITHUB_OUTPUT"
          echo "staged release: ${STAGED:-none}"
          echo "live release:   ${LIVE:-none}"
          if [ -z "$STAGED" ]; then
            echo "::error::nothing is staged; refresh.yml did not stage a release"
            exit 1
          fi
          if [ "$STAGED" = "$LIVE" ]; then
            echo "already_live=true" >> "$GITHUB_OUTPUT"
            echo "the staged release is already live — nothing to promote"
          fi
          # Staleness: a candidate older than three days means day 1 has been failing and
          # this is no longer "yesterday's data" — fail loudly instead of promoting it.
          CANDIDATE_DATE="${STAGED%%.*}"
          AGE_DAYS=$(( ( $(date -u +%s) - $(date -u -d "$CANDIDATE_DATE" +%s) ) / 86400 ))
          echo "age_days=$AGE_DAYS" >> "$GITHUB_OUTPUT"
          echo "staged ${AGE_DAYS} day(s) old"
          if [ "$AGE_DAYS" -gt 3 ]; then
            echo "::error::the staged release is ${AGE_DAYS} days old; refresh.yml has not staged anything recent"
            exit 1
          fi

      # `download-artifact` defaults to the run it is called in, and this run has no site
      # artifact of its own — the pages were built by day 1. Unqualified, the step below
      # finds nothing, `if-no-files-found: warn` keeps the run green, the deploy step then
      # skips ("no site artifact for this candidate") and the pointer moves while the site
      # stays on yesterday's pages: the exact inconsistency the ordering at the top of this
      # file exists to prevent. So resolve the day-1 run first, and let a missing artifact
      # be a refusal rather than a silent skip.
      - name: Find the site artifact day 1 built
        id: site
        if: ${{ !inputs.skip_deploy && steps.resolve.outputs.already_live != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Newest unexpired `site` artifact. Day 1 keeps it 3 days and the candidate-age
          # guard above already refuses anything older than that.
          RUN_ID=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=site&per_page=30" \
            --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::no unexpired 'site' artifact exists; run refresh.yml (README §Day 1) before promoting"
            exit 1
          fi
          echo "site artifact from refresh run $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Move the data pointer (production)
        if: steps.resolve.outputs.already_live != 'true'
        working-directory: pipeline
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          ARGS=(--release "${{ steps.resolve.outputs.staged }}" --allow-live)
          if [ "${{ inputs.allow_downgrade }}" = "true" ]; then ARGS+=(--allow-downgrade); fi
          # Proves the staged release is internally consistent from the public host and
          # then writes the one mutable object. It re-uploads nothing.
          python -m pipeline.release promote "${ARGS[@]}"

      # The app is rebuilt, not downloaded. `pnpm build` is the same command
      # `deploy-site.yml` runs, from this run's checkout of `main`; nothing here can
      # make it older than the last merge.
      - name: Install the site
        if: ${{ !inputs.skip_deploy && steps.resolve.outputs.already_live != 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Build the app from this commit
        if: ${{ !inputs.skip_deploy && steps.resolve.outputs.already_live != 'true' }}
        run: pnpm build

      - uses: actions/download-artifact@v4
        if: ${{ !inputs.skip_deploy && steps.resolve.outputs.already_live != 'true' }}
        with:
          name: site
          path: artifacts/site
          # Cross-run: the artifact belongs to the refresh run resolved above, not this one.
          run-id: ${{ steps.site.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          if-no-files-found: error

      - name: Take day 1's generated pages over this build
        if: ${{ !inputs.skip_deploy && steps.resolve.outputs.already_live != 'true' }}
        run: |
          set -euo pipefail
          # The app build must be whole before anything is layered on it.
          if [ ! -f web/out/index.html ]; then
            echo "::error::the app build produced no index.html; nothing to deploy"
            exit 1
          fi
          # The artifact is a *whole site* compiled by day 1. Only the files day 1
          # generated are taken from it — its fund pages and their stylesheet.
          # Everything else in it is a code bundle of unknown age (see the header) and is
          # discarded; `web/out` keeps this run's build.
          for PATHNAME in f fund-page.css; do
            if [ ! -e "artifacts/site/$PATHNAME" ]; then
              echo "::error::the site artifact has no $PATHNAME; day 1 did not finish the pages"
              exit 1
            fi
            rm -rf "web/out/$PATHNAME"
            cp -a "artifacts/site/$PATHNAME" "web/out/$PATHNAME"
          done
          # The generator writes the sitemap and robots file only when it renders the
          # release as indexable, and the three move together (fund_pages.build). So take
          # them when day 1 wrote them, and otherwise leave the build's own — a site that
          # is `noindex` must not ship a sitemap.
          for PATHNAME in sitemap.xml robots.txt; do
            if [ -e "artifacts/site/$PATHNAME" ]; then
              rm -rf "web/out/$PATHNAME"
              cp -a "artifacts/site/$PATHNAME" "web/out/$PATHNAME"
            fi
          done
          PAGES=$(find web/out/f -name index.html | wc -l | tr -d ' ')
          echo "fund pages from day 1: $PAGES"
          echo "files to deploy: $(find web/out -type f | wc -l)"
          # The same floor `deploy-site.yml` enforces: a generator change that writes
          # nothing must fail the promotion, not publish an app without its pages.
          test "$PAGES" -ge 8000
          test "$(find web/out -type f | wc -l)" -le 20000

      - name: Deploy this commit's app with day 1's pages
        if: ${{ !inputs.skip_deploy && steps.resolve.outputs.already_live != 'true' }}
        env:
          # wrangler's env var name is CLOUDFLARE_API_TOKEN; the repository secret is
          # CLOUDFLARE_ACCOUNT_API_TOKEN (set 2026-10-28), so map one onto the other rather
          # than asking for the same credential under a second name.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCOUNT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Reached only past the overlay's guards, so `web/out` is an app build with
          # day 1's pages in it. The pointer is already live by now; shipping nothing
          # would leave the pages a day behind the data.
          npx --yes ${{ env.WRANGLER }} deploy --config wrangler.prod.jsonc

      - name: Smoke the live surfaces
        if: steps.resolve.outputs.already_live != 'true'
        run: |
          set -euo pipefail
          for URL in "$SITE_HOST/" "$SITE_HOST/funds/" "$SITE_HOST/x/" \
                     "$PREVIEW_HOST/" \
                     "$DATA_HOST/latest/release.json?probe=$(date +%s)"; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 "$URL")
            echo "$URL -> $CODE"
            test "$CODE" = "200"
          done
          # The pointer must name what we just promoted, not merely answer 200.
          LIVE=$(curl -fsS --retry 3 "$DATA_HOST/latest/release.json?probe=$(date +%s)" \
            | python -c "import json,sys;print(json.load(sys.stdin).get('as_of',''))")
          echo "live pointer now: $LIVE"
          test "$LIVE" = "${{ steps.resolve.outputs.staged }}"
          # …and the page must be *this* build. Asset names are content-hashed, so every
          # chunk named by the local build appearing in the served HTML is proof the
          # deployment landed; one missing means production is serving some other version,
          # which is the failure that made a promoted site lose a merged feature on
          # 2026-11-02. Compare the whole set, not one name: entry chunks that did not
          # change between two builds carry the same name and would hide the difference.
          if [ "${{ inputs.skip_deploy }}" != "true" ]; then
            SERVED=$(curl -fsS --retry 3 "$SITE_HOST/x/?probe=$(date +%s)")
            MISSING=0
            for CHUNK in $(grep -o '/_next/static/chunks/[a-z0-9_.-]*\.js' web/out/x/index.html | sort -u); do
              if ! printf '%s' "$SERVED" | grep -qF "$CHUNK"; then
                echo "not in the served page: $CHUNK"
                MISSING=1
              fi
            done
            if [ "$MISSING" != "0" ]; then
              echo "::error::production is serving another version; the served /x/ lacks this build's chunks"
              exit 1
            fi
            echo "served /x/ names this build's chunks"
          fi

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Promotion"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| staged release | ${{ steps.resolve.outputs.staged }} |"
            echo "| live release before | ${{ steps.resolve.outputs.live }} |"
            echo "| already live | ${{ steps.resolve.outputs.already_live }} |"
            echo "| candidate age (days) | ${{ steps.resolve.outputs.age_days }} |"
            echo
            # The prune moved to `prune.yml` on 2026-11-10 (a red prune must not gate
            # deploy-site), so this run writes no plan; say so rather than printing nothing.
            echo "**retention** — pruned by the separate \`prune\` workflow after this run."
            if [ -f artifacts/retention/plan.json ]; then
              echo "**retention plan**"
              echo '```json'
              head -c 3000 artifacts/retention/plan.json || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promotion
          path: |
            artifacts/retention/
            node_modules/.wrangler/
          retention-days: 14
          if-no-files-found: ignore

      # The other half of the nightly ledger: `refresh` records what was built, this records
      # whether it reached production. A failed promote leaves the site on yesterday's release
      # and looks like a green day in the Actions list unless someone reads this line.
      - name: Record the promotion in the ledger
        if: always()
        continue-on-error: true      # telemetry can never be the reason a promotion is red
        env:
          STATUS: ${{ job.status == 'success' && 'ok' || 'failed' }}
          RELEASE: ${{ steps.resolve.outputs.staged }}
          ALREADY: ${{ steps.resolve.outputs.already_live }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          # Nothing to promote is a success, not a promotion — same distinction `refresh`
          # makes between a night with no filings and a night that failed.
          KIND=promote
          if [ "$ALREADY" = "true" ]; then KIND=idle; fi
          python -m pipeline.telemetry append --ledger nightly \
            --kind "$KIND" --status "$STATUS" --release "$RELEASE" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
