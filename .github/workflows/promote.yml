# Day 2 of the daily loop: promote yesterday's staged release to production.
#
# Why a second run and not the end of the first: the staged release spends a day on the
# preview Worker and in `staging/`, which is a window for the checks to run twice, for a
# human to look, and for a bad pull to be caught before it is what the site serves.
# The gate that matters is the checks, not the delay.
#
# Order, and it is deliberate (cloudflare-workers-r2-deploy §5):
#   1. the data pointer moves first — the app reads it, and the pages discover their
#      numbers through it;
#   2. then the Worker that serves the pages, from the *same artifact* day 1 built, so a
#      promotion cannot publish pages nobody reviewed;
#   3. then retention, so the prune runs only after a successful promotion.
# A failure at (2) leaves fresh data with pages one day old, which is visible and
# recoverable; the reverse (new pages, old data) would show a fund page the app disagrees
# with.
#
# Refuses, rather than guesses, when: there is no staged candidate, the candidate is
# already live, the candidate is more than 3 days old (day 1 has been failing), or the
# artifact day 1 produced is missing.

name: promote

on:
  workflow_dispatch:
    inputs:
      release:
        description: "release id to promote (default: whatever staging/latest names)"
        default: ""
      allow_downgrade:
        description: "permit promoting an OLDER release id — this is the rollback path"
        type: boolean
        default: false
      skip_deploy:
        description: "move the data pointer only, leave the site on its current version"
        type: boolean
        default: false
      prune_force:
        # The 60% mass-delete guard exists so a truncated bucket listing cannot empty the
        # bucket. The first real prune legitimately crosses it (72.6%: four full releases
        # and one five-fund rehearsal release exist, and only two are kept), so this is a
        # one-time switch for that run — never leave it on.
        description: "allow the prune to remove more than 60% of the bucket (first run only)"
        type: boolean
        default: false
  # Live since 2026-10-30: the first promotion was watched by hand (`workflow_dispatch`),
  # went green, and only then was this schedule switched on.
  #
  # **05:45 UTC, before the 06:30 refresh — not after it.** The two files share the
  # `data-refresh` concurrency group, so a promotion cannot overlap a refresh, and the
  # order decides *what* gets promoted: `staging/latest/release.json` is a single pointer
  # that the morning refresh overwrites at its end. A promotion scheduled after the
  # refresh would therefore promote a release built an hour earlier and lose the day of
  # soak entirely. Running first pins the candidate to what yesterday's run staged and
  # verified.
  #
  # Residual risk, accepted: GitHub's cron is best-effort, so a promotion that starts
  # after 06:30 waits for the refresh and then promotes the newer release. That shortens
  # the soak to minutes; it does not promote anything the gates failed, because the
  # pointer is only written after every object verified.
  schedule:
    - cron: "45 5 * * *"

permissions:
  contents: read
  # The site artifact is uploaded by *yesterday's* refresh run, so this workflow has to
  # list and download artifacts across runs. Without it `download-artifact` silently finds
  # nothing and the promotion would move the pointer while the site stayed a day old.
  actions: read

# Same group as refresh: never let a promotion overlap a build.
concurrency:
  group: data-refresh
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  WRANGLER: "wrangler@4.155.0"
  DATA_HOST: "https://data.unpackfund.com"
  PREVIEW_HOST: "https://unpackfund-preview.mitchell-layton.workers.dev"
  SITE_HOST: "https://unpackfund.com"

jobs:
  promote:
    name: promote the staged release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./pipeline

      # curl, not urllib: the data host answers Python-urllib with 403 (edge rule), and a
      # cached 404 on a pointer is why the query string is there.
      - name: Resolve what to promote
        id: resolve
        run: |
          set -euo pipefail
          probe() { curl -fsS --retry 3 --retry-delay 2 "$1?probe=$(date +%s)"; }
          STAGED="${{ inputs.release }}"
          if [ -z "$STAGED" ]; then
            STAGED=$(probe "$DATA_HOST/staging/latest/release.json" | python -c "import json,sys;print(json.load(sys.stdin)['as_of'])")
          fi
          LIVE=$(probe "$DATA_HOST/latest/release.json" 2>/dev/null | python -c "import json,sys;print(json.load(sys.stdin).get('as_of',''))" || echo "")
          echo "staged=$STAGED" >> "$GITHUB_OUTPUT"
          echo "live=$LIVE" >> "$GITHUB_OUTPUT"
          echo "staged release: ${STAGED:-none}"
          echo "live release:   ${LIVE:-none}"
          if [ -z "$STAGED" ]; then
            echo "::error::nothing is staged; refresh.yml did not stage a release"
            exit 1
          fi
          if [ "$STAGED" = "$LIVE" ]; then
            echo "already_live=true" >> "$GITHUB_OUTPUT"
            echo "the staged release is already live — nothing to promote"
          fi
          # Staleness: a candidate older than three days means day 1 has been failing and
          # this is no longer "yesterday's data" — fail loudly instead of promoting it.
          CANDIDATE_DATE="${STAGED%%.*}"
          AGE_DAYS=$(( ( $(date -u +%s) - $(date -u -d "$CANDIDATE_DATE" +%s) ) / 86400 ))
          echo "age_days=$AGE_DAYS" >> "$GITHUB_OUTPUT"
          echo "staged ${AGE_DAYS} day(s) old"
          if [ "$AGE_DAYS" -gt 3 ]; then
            echo "::error::the staged release is ${AGE_DAYS} days old; refresh.yml has not staged anything recent"
            exit 1
          fi

      # `download-artifact` defaults to the run it is called in, and this run has no site
      # artifact of its own — the pages were built by day 1. Unqualified, the step below
      # finds nothing, `if-no-files-found: warn` keeps the run green, the deploy step then
      # skips ("no site artifact for this candidate") and the pointer moves while the site
      # stays on yesterday's pages: the exact inconsistency the ordering at the top of this
      # file exists to prevent. So resolve the day-1 run first, and let a missing artifact
      # be a refusal rather than a silent skip.
      - name: Find the site artifact day 1 built
        id: site
        if: ${{ !inputs.skip_deploy && steps.resolve.outputs.already_live != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Newest unexpired `site` artifact. Day 1 keeps it 3 days and the candidate-age
          # guard above already refuses anything older than that.
          RUN_ID=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=site&per_page=30" \
            --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::no unexpired 'site' artifact exists; run refresh.yml (README §Day 1) before promoting"
            exit 1
          fi
          echo "site artifact from refresh run $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Move the data pointer (production)
        if: steps.resolve.outputs.already_live != 'true'
        working-directory: pipeline
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          ARGS=(--release "${{ steps.resolve.outputs.staged }}" --allow-live)
          if [ "${{ inputs.allow_downgrade }}" = "true" ]; then ARGS+=(--allow-downgrade); fi
          # Proves the staged release is internally consistent from the public host and
          # then writes the one mutable object. It re-uploads nothing.
          python -m pipeline.release promote "${ARGS[@]}"

      - uses: actions/download-artifact@v4
        if: ${{ !inputs.skip_deploy && steps.resolve.outputs.already_live != 'true' }}
        with:
          name: site
          path: web/out
          # Cross-run: the artifact belongs to the refresh run resolved above, not this one.
          run-id: ${{ steps.site.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          if-no-files-found: error

      - name: Deploy the site that day 1 built
        if: ${{ !inputs.skip_deploy && steps.resolve.outputs.already_live != 'true' }}
        env:
          # wrangler's env var name is CLOUDFLARE_API_TOKEN; the repository secret is
          # CLOUDFLARE_ACCOUNT_API_TOKEN (set 2026-10-28), so map one onto the other rather
          # than asking for the same credential under a second name.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCOUNT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # The download above fails the run rather than warning, so reaching this without
          # index.html means the artifact was empty. Refuse: the pointer is already live by
          # now, and shipping nothing leaves pages a day behind the data.
          if [ ! -f web/out/index.html ]; then
            echo "::error::the site artifact is empty; production still serves the previous pages"
            exit 1
          fi
          echo "files to deploy: $(find web/out -type f | wc -l)"
          test "$(find web/out -type f | wc -l)" -le 20000
          npx --yes ${{ env.WRANGLER }} deploy --config wrangler.prod.jsonc

      - name: Smoke the live surfaces
        if: steps.resolve.outputs.already_live != 'true'
        run: |
          set -euo pipefail
          for URL in "$SITE_HOST/" "$SITE_HOST/funds/" "$SITE_HOST/x/" \
                     "$PREVIEW_HOST/" \
                     "$DATA_HOST/latest/release.json?probe=$(date +%s)"; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 "$URL")
            echo "$URL -> $CODE"
            test "$CODE" = "200"
          done
          # The pointer must name what we just promoted, not merely answer 200.
          LIVE=$(curl -fsS --retry 3 "$DATA_HOST/latest/release.json?probe=$(date +%s)" \
            | python -c "import json,sys;print(json.load(sys.stdin).get('as_of',''))")
          echo "live pointer now: $LIVE"
          test "$LIVE" = "${{ steps.resolve.outputs.staged }}"

      # Free operations only: DeleteObject is not billed, so a prune never touches the ops
      # budget — it moves GB-month, which is the whole point (ADR-0011).
      #
      # `plan` runs first and its JSON is kept with the run even if `apply` fails; `apply`
      # then re-derives the same plan from the same inputs and acts on it. It never runs if
      # the promotion itself failed (`already_live` short-circuit above) and is
      # `continue-on-error` because a refused prune must not mark a good promotion failed.
      #
      # The five prefixes below are named as ignored, never deleted: they are the day-4
      # five-fund rehearsals, uploaded before `release.json` existed, so they have `funds/`
      # and no descriptor. `retention` refuses any release-looking prefix it cannot read,
      # which is the right default; this list is the operator's explicit exception.
      - name: Prune old releases (stay inside the R2 free tier)
        if: steps.resolve.outputs.already_live != 'true'
        working-directory: pipeline
        continue-on-error: true
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          LEGACY=(
            --ignore-prefix releases/2026-10-28
            --ignore-prefix releases/2026-10-28.2
            --ignore-prefix releases/2026-10-28.3
            --ignore-prefix releases/2026-10-29.1
            --ignore-prefix releases/2026-10-29.2
          )
          python -m pipeline.retention plan "${LEGACY[@]}" --json ../artifacts/retention/plan.json
          FORCE=()
          if [ "${{ inputs.prune_force }}" = "true" ]; then FORCE+=(--force); fi
          python -m pipeline.retention apply "${LEGACY[@]}" "${FORCE[@]}" --yes

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Promotion"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| staged release | ${{ steps.resolve.outputs.staged }} |"
            echo "| live release before | ${{ steps.resolve.outputs.live }} |"
            echo "| already live | ${{ steps.resolve.outputs.already_live }} |"
            echo "| candidate age (days) | ${{ steps.resolve.outputs.age_days }} |"
            echo
            if [ -f artifacts/retention/plan.json ]; then
              echo "**retention plan**"
              echo '```json'
              head -c 3000 artifacts/retention/plan.json || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promotion
          path: |
            artifacts/retention/
            node_modules/.wrangler/
          retention-days: 14
          if-no-files-found: ignore
