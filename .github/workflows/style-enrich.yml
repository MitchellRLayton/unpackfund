# Reads the fund names the rule engine cannot classify, offline, with Jev.
#
# What this is not: a build step. `build.py` must hash identically twice (invariant I5),
# so a model call can never sit inside it. This job runs *after* the day's release has
# been built and promoted, writes one committed CSV, and the next day's build reads it.
# The site is never waiting on a model, and the promote gate (ADR-0011) stays model-free.
#
# The loop it closes: a net-new fund arrives → refresh builds it → its filed name is
# unreadable → this job asks Jev once → a reviewed row lands in
# `pipeline/overrides/style_jev.csv` → the next build puts that fund in a peer group.
#
# Cost: 0.042 $/M input tokens, no output charge. A first full pass over ~900 unreadable
# names is ~$0.035; a steady-state day is a handful of names, fractions of a cent.
#
# Two files are committed and both are the job's memory:
#   overrides/style_jev.csv          the accepted buckets (read by the build)
#   overrides/style_jev_refused.csv  names that produced nothing, and why
# A name in either file is never paid for twice.
#
# Rollback is `git revert` of the commit: the build falls back to issuer links for those
# funds and no other page changes, because a rule hit always outranks an override.

name: style-enrich

on:
  workflow_dispatch:
    inputs:
      max_new:
        description: "cap names sent in this run"
        default: "300"
      dry_run:
        description: "build the request and print the cost estimate, send nothing"
        type: boolean
        default: false
  schedule:
    # 07:15 UTC, 45 minutes after promote.yml (05:45) and 45 after refresh.yml (06:30),
    # so it reads the release the site is actually serving rather than one mid-build.
    - cron: "15 7 * * *"

permissions:
  contents: write

concurrency:
  group: style-enrich
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  # The public origin, so the job classifies exactly the names the live site shows.
  SITE: "https://data.unpackfund.com"

jobs:
  enrich:
    name: classify unreadable fund names
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./pipeline

      - name: Confirm the classifier layer is intact before spending anything
        working-directory: pipeline
        run: python -m pytest tests/test_style_jev.py tests/test_fund_pages.py -q

      # A scheduled job that fails every morning because a secret is missing is noise that
      # trains people to ignore red runs. Until the credential exists, say so and stop.
      - name: Check for the credential
        id: creds
        env:
          KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${KEY}" ]; then
            echo "OPENROUTER_API_KEY is not a repository secret yet — skipping (ADR-0012)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask Jev about the names the rules cannot read
        if: steps.creds.outputs.ready == 'true'
        working-directory: pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          MAX="${{ inputs.max_new || '300' }}"
          APPLY="--apply"
          if [ "${{ inputs.dry_run }}" = "true" ]; then APPLY=""; fi
          python -m pipeline.style_jev fill --from-url "$SITE" \
            --max-new "$MAX" $APPLY \
            --out overrides/style_jev.csv \
            --refused overrides/style_jev_refused.csv
          {
            echo "### Jev classification"
            echo
            echo "- unreadable names answered: see the step log for the row count"
            echo "- model: \`typesafe/jev-1.14\` via the Decisions endpoint"
            echo "- release: \`$SITE/latest/release.json\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the reviewed rows
        if: steps.creds.outputs.ready == 'true'
        # Only these two paths are staged, so a secret cannot ride along, and the diff is
        # the review record: every row says which fund, which bucket, and how sure.
        run: |
          set -euo pipefail
          if git diff --quiet -- pipeline/overrides/style_jev.csv \
                                  pipeline/overrides/style_jev_refused.csv; then
            echo "no new rows today"
            exit 0
          fi
          git config user.name "unpackfund-bot"
          git config user.email "bot@unpackfund.com"
          git add pipeline/overrides/style_jev.csv pipeline/overrides/style_jev_refused.csv
          git diff --cached --stat
          git commit -m "chore(style): add Jev-read buckets for unreadable fund names" \
                     -m "Generated by style-enrich.yml from the promoted release. A rule hit still outranks every row here."
          GIT_TERMINAL_PROMPT=0 git push origin HEAD:main
