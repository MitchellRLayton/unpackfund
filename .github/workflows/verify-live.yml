# Verifying production without a laptop: pages vs the live data, and the hand-off.
#
# Why this exists. `deploy-site.yml` republishes production on a push to `main` *and* on
# the `workflow_run` event that follows a successful `promote` — the second is what stops
# a data promotion from leaving app code a day stale. Every deploy-site run before
# 2026-10-31 was triggered by a push, so that hand-off path had never actually fired.
#
# Checking it from the operator's machine only works while the machine is awake, and the
# promotion runs at 22:45 PT. So the check lives here instead: it runs on GitHub's
# infrastructure at 00:15 PT (after the 05:45Z promote and 06:30Z refresh) and again at
# 05:00 PT, in case the scheduler slipped the way it did on 2026-10-31 (5.5–6.4 h late).
#
# The five checks are in `scripts/verify-live.py`, which needs no secrets to read: the data
# origin and the site are public, and the run history is read with the workflow's own
# GITHUB_TOKEN. A failure fails the run — that is the alarm, since a red scheduled run
# notifies the repository owner.
#
# The verdict is also appended to `monitoring/verify-live.jsonl`, so "how have the checks
# been going?" is a file instead of a scroll through run history (logs and artifacts expire).
# That write is the only part of this workflow that uses a secret, and it cannot publish
# anything: one line, outside every release prefix. See
# `docs/08-operations/2026-11-02-nightly-telemetry.md`.
#
# Not a deploy. Nothing here writes to a release prefix or a pointer.

name: verify-live

on:
  schedule:
    - cron: "15 7 * * *"    # 00:15 PT, ~1.5 h after the promote slot
    - cron: "0 12 * * *"    # 05:00 PT, catches a promotion that slipped hours late
  workflow_dispatch:
    inputs:
      site_host:
        description: "site to verify (default: production) — a bad value here is how the alarm itself gets tested"
        default: "https://unpackfund.com"

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-live
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify the live site against the live data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_HOST: ${{ inputs.site_host || 'https://unpackfund.com' }}
          DATA_BASE: https://data.unpackfund.com
        run: |
          set -o pipefail
          python3 scripts/verify-live.py | tee verify-live.txt
          # pipefail makes a failing check fail this step, which fails the run; the
          # summary step below still runs (if: always()).

      - name: Install the pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./pipeline

      - name: Append the verdict to the ledger
        if: always()
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ ! -f verify-live.txt ]; then
            : > verify-live.txt      # the verifier died before printing; a line still gets written
          fi
          python -m pipeline.telemetry append --ledger verify-live \
            --report verify-live.txt \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Write the job summary
        if: always()
        run: |
          {
            echo "## verify-live"
            echo ""
            echo "Site vs live data version, and the \`promote\` → \`deploy-site\` hand-off."
            echo ""
            echo '```'
            cat verify-live.txt 2>/dev/null || echo "(the verifier produced no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
