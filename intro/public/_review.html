<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The Unpacking — review frames</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #14161a;
        color: #e8e6e1;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 14px;
      }
      h1 {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #9aa0a8;
        margin: 0 0 12px;
      }
      .row {
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin-top: 6px;
        color: #9aa0a8;
        letter-spacing: 0.06em;
      }
      .phone {
        width: 390px;
        height: 844px;
        transform: scale(0.88);
        transform-origin: top left;
      }
      .phone-wrap {
        width: 343px;
        overflow: hidden;
      }
      .wide {
        width: 1100px;
        height: 700px;
        transform: scale(0.55);
        transform-origin: top left;
      }
      .wide-wrap {
        width: 605px;
        height: 400px;
        overflow: hidden;
      }
      iframe {
        border: 1px solid #2b2f36;
        border-radius: 10px;
        background: #fff;
        display: block;
      }
    </style>
  </head>
  <body>
    <h1 id="title">The Unpacking — review frames</h1>
    <div class="row" id="row"></div>
    <script>
      const sets = {
        phones: [
          ["portrait 390×844 — spill, t 3.0", "/index.html?intro=force&t=3.0&v=p1", "phone"],
          ["portrait — merge, t 4.45, dark", "/index.html?intro=force&t=4.45&theme=dark&v=p2", "phone"],
          ["portrait — last frame, t 7.4", "/index.html?intro=force&t=7.4&v=p3", "phone"],
        ],
        wide: [
          ["wide 1100×700 — merge, dark, t 4.45", "/index.html?intro=force&t=4.45&theme=dark&v=w1", "wide"],
          ["wide — reduced motion, final frame", "/index.html?intro=force&reduced=1&v=w2", "wide"],
        ],
      };
      const set = new URLSearchParams(location.search).get("set") || "phones";
      const row = document.getElementById("row");
      row.style.flexWrap = "wrap";
      row.style.maxWidth = "1260px";
      sets[set].forEach(([label, src, kind]) => {
        const figure = document.createElement("figure");
        figure.className = kind === "phone" ? "phone-wrap" : "wide-wrap";
        const frame = document.createElement("iframe");
        frame.className = kind;
        frame.src = src;
        frame.loading = "eager";
        const caption = document.createElement("figcaption");
        caption.textContent = label;
        figure.append(frame, caption);
        row.append(figure);
      });
    </script>
  </body>
</html>
