<?xml version="1.0" encoding="UTF-8"?>
<!--
  Inline XBRL: the fact is display text, so the number a reader sees is not the
  number the filing states. "1,234" with scale="6" is 1,234,000,000.
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ix="http://www.xbrl.org/2013/inlineXBRL"
      xmlns:xbrli="http://www.xbrl.org/2003/instance"
      xmlns:xbrldi="http://xbrl.org/2006/xbrldi"
      xmlns:dei="http://xbrl.sec.gov/dei/2024"
      xmlns:us-gaap="http://fasb.org/us-gaap/2024"
      xmlns:acme="http://www.acme.com/20240630">
  <head>
    <title>Acme Corporation 10-Q</title>
  </head>
  <body>
    <div style="display:none">
      <ix:header>
        <ix:resources>
          <xbrli:context id="C-cover">
            <xbrli:entity>
              <xbrli:identifier scheme="http://www.sec.gov/CIK">0000000006</xbrli:identifier>
            </xbrli:entity>
            <xbrli:period>
              <xbrli:instant>2024-06-30</xbrli:instant>
            </xbrli:period>
          </xbrli:context>
          <xbrli:context id="C-class-a">
            <xbrli:entity>
              <xbrli:identifier scheme="http://www.sec.gov/CIK">0000000006</xbrli:identifier>
            </xbrli:entity>
            <xbrli:period>
              <xbrli:instant>2024-06-30</xbrli:instant>
            </xbrli:period>
            <xbrli:scenario>
              <xbrldi:explicitMember dimension="us-gaap:StatementClassOfStockAxis">acme:CommonClassAMember</xbrldi:explicitMember>
            </xbrli:scenario>
          </xbrli:context>
          <xbrli:unit id="shares">
            <xbrli:measure>xbrli:shares</xbrli:measure>
          </xbrli:unit>
        </ix:resources>
      </ix:header>
    </div>
    <p>
      As of June 30, 2024, the registrant had
      <ix:nonFraction name="dei:EntityCommonStockSharesOutstanding" contextRef="C-cover"
                      unitRef="shares" decimals="0" scale="6" format="ixt:num-dot-decimal">1,234</ix:nonFraction>
      shares of common stock outstanding.
    </p>
    <p>
      The registrant also had
      <ix:nonFraction name="dei:EntityCommonStockSharesOutstanding" contextRef="C-class-a"
                      unitRef="shares" decimals="0" scale="6" format="ixt:num-dot-decimal">1,000</ix:nonFraction>
      shares of class A common stock outstanding.
    </p>
  </body>
</html>
