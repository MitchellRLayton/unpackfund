# platform-spec.yaml — scoped UnpackFund work (types in PROMPT.md §2)
# Scope: WS-A stock-only basis · WS-B accounts · WS-C expense ratios · WS-D holdings dates.

meta:
  spec_version: 2
  site: https://unpackfund.com
  release_inspected: "2026-11-17.1"
  methodology_version_now: "1.5.0"
  methodology_version_after_ws_a_switch: "1.6.0"
  product_stance: "Built for equity-only or equity-heavy portfolios. Bonds and cash, inside funds and as holdings, are left out of every number."

# ─────────────────────────────────────────────────────────────────────────────
# OWNER DECISIONS — never implement before a written answer
# ─────────────────────────────────────────────────────────────────────────────
owner_decisions:
  OD-1: { title: "Company weights are a share of…", decide_after: T-A.4, options: { A: "your stocks: weights sum to 100% across companies (recommended)", B: "your whole portfolio: weights sum to the stock share" } }
  OD-2: { title: "Switch every number to the stock-only basis", decide_after: T-A.4, options: { A: "Switch", B: "Don't switch" } }
  OD-3: { title: "Holding limit", decide_after: T-B.1, options: { A: "Raise 40 → 60 (recommended with accounts)", B: "Keep 40" } }
  OD-4: { title: "Read prospectus and shareholder-report XBRL for expense ratios (reverses 'deliberately not read')", decide_after: T-C.1, options: { A: "Yes (recommended)", B: "No" } }
  OD-5: { title: "Expense ratios for funds with no tagged filing (e.g. unit-trust ETFs)", decide_after: T-C.1, options: { A: "Show none (recommended unless a widely held fund is missing)", B: "Small manual table, each row citing its prospectus URL and date" } }

# ─────────────────────────────────────────────────────────────────────────────
# INVESTIGATIONS — Phase 0, read-only; answer with file:line
# ─────────────────────────────────────────────────────────────────────────────
investigations:
  INV-1: "Does the N-PORT parser keep assetCat (and its 'conditional' variant) per position after fund-of-funds flattening? Give the field names and the code list it recognises."
  INV-2: "Where are coverage, Core/Broad/Top 10, the Markets split and the companies table computed (backend, frontend, or both)? List every place that divides by the fund's gross weight."
  INV-3: "How does ticker lookup work: which EDGAR ticker file? For each of VMFXX, SPAXX, FDLXX, SWVXX, VUSXX, FZFXX: in the file Y/N, series_id, latest holdings form."
  INV-4: "Document the exact v1/v2/v3 URL grammars (element kinds, units, encoder) and the lens suffix. Where is the 40-holding limit enforced? Does the list reject a duplicate ticker?"
  INV-5: "Expense-ratio sources: (a) the risk/return XBRL element for the net expense ratio per class in 485BPOS/497 filings (expected in the rr taxonomy, e.g. rr:NetExpensesOverAssets; confirm the real name); (b) oef:ExpenseRatioPct in N-CSR/N-CSRS inline XBRL; (c) how a ticker maps to the class axis in each; (d) request-count estimate for the latest filing per class; (e) which tickers in the release have neither source, with the 20 largest by net assets listed."
  INV-6: "Where are the per-fund date chip and the copy-spec CN_DATES note rendered? Which date do they use (period end or filed date)?"

# ─────────────────────────────────────────────────────────────────────────────
# FIXTURES
# ─────────────────────────────────────────────────────────────────────────────
fixtures:
