# automation-spec.yaml — GitHub automation addendum
# Commit to docs/platform/automation-spec.yaml. Types and rules: docs/platform/PROMPT.md §2–§3.
#
# This file covers the GitHub-side automation only:
#   AU-1 math-review workflow (.github/workflows/math-review.yml + scripts/review/review.py)
#   AU-2 nightly daily-index job extension (money market + fee filings)
#   AU-3 refused-series investigation
#   AU-4 WS-A corrections the review must enforce
#
# It amends platform-spec.yaml. Where the two conflict for a task id listed under
# `amends`, this file wins. platform-spec.yaml itself is not edited.

meta:
  spec_version: 1
  amends_spec: docs/platform/platform-spec.yaml
  facts_from_pipeline_report_2026_11_18:
    - "Nightly 06:30 UTC check+build reads the EDGAR daily index (last 3 filing days) intersected with published registrants; 05:45 UTC promote moves the release pointer."
    - "The validator already recomputes HHI, effective N, top ten, the asset-class split and per-class coverage (±0.05) and fails the release on mismatch."
    - "Builds must hash identically; the browser hash-checks fund documents; a test pins browser and pipeline values."
    - "Weights are integer bp of NAV, largest-remainder rounding, sums in 9,000–10,500 (VTI 10,047). Unmapped weight is disclosed, never redistributed."
    - "Per-class coverage exists (VTI: 100% of its equity sleeve)."
    - "Run of 2026-10-30 refused 3,282 of 12,265 candidate series."

# ─────────────────────────────────────────────────────────────────────────────
# Amendments to platform-spec.yaml
# ─────────────────────────────────────────────────────────────────────────────
amends:
  INV-1: "Replace with INV-AU-1."
  T-A.2: "Do not add coverage_eq or coverage_eq_band if the existing per-class equity coverage field matches equity_rule (INV-AU-1). Reuse it, and add only equity_share if it's missing. If the existing equity sleeve includes EP, STOP and report; that goes to the owner."
  data_contracts.fund_fields_new.equity_share: "equity_share = Σ weight_bp of stock rows (mapped + unmapped) ÷ 10,000. Denominator is NAV, not the row sum."
  data_contracts.portfolio_math: |-
    w_if = company i's bp in fund f ÷ the fund's total stock bp (mapped + unmapped stock rows).
    Unmapped stock stays in the denominator and is shown as its own residual row. It is never spread over traced companies.
    The other lines are unchanged.
  T-A.6: "The mmf_aliases backend comes from AU-2 (T-AU-2.2). Remove any separate EDGAR download from T-A.6."
  T-C.3: "Filing discovery comes from AU-2 (T-AU-2.3). T-C.3 parses only the filings AU-2 lists."

# ─────────────────────────────────────────────────────────────────────────────
# Investigations (read-only; answer with file:line)
# ─────────────────────────────────────────────────────────────────────────────
investigations:
  INV-AU-1: "Name the field that holds per-class coverage and the asset-class split in a fund document. Which assetCat codes form the equity class (is EP included)? Where does the validator recompute them?"
  INV-AU-2: "Where do the scheduled jobs run (GitHub Actions, Cloudflare Cron Triggers, elsewhere)? Give the workflow or wrangler file and the cron lines."
  INV-AU-3: "List every existing test of browser-side portfolio math (ledger, overlap, bands, CSV export) with file and test name. Map each to the invariants in AU-1 T-AU-1.2."
  INV-AU-4: "In the daily-index reader: which form types does it keep today? Where is the registrant intersection? Is the full index line (form type, CIK, accession, date) available before filtering?"
  INV-AU-5: "Where is the refusal log, what is its schema, and does each entry carry series_id, registrant, reason code, NAV and filing date?"

# ─────────────────────────────────────────────────────────────────────────────
# Workstreams
# ─────────────────────────────────────────────────────────────────────────────
workstreams:

# ═══ AU-1 Math-review workflow ═══════════════════════════════════════════════
- ws: AU-1
  title: "Second-model math review in GitHub Actions"
  tasks:
  - id: T-AU-1.1
    phase: A
    kind: INVESTIGATE
    title: "Calculation files and existing tests"
    approval: PRE_APPROVED
    number_impact: NONE
    spec: "Answer INV-AU-2 and INV-AU-3. List every file that computes weights, HHI/effective N, top ten, coverage, bands, Markets, overlap or CSV values, in the pipeline and the browser."
    acceptance: ["File list cites file:line for each computation", "Each AU-1 invariant marked COVERED (test name) or MISSING"]
  - id: T-AU-1.2
    phase: A
    kind: TEST
    title: "Add only the missing invariant tests"
    approval: PRE_APPROVED
    number_impact: NONE
    depends_on: [T-AU-1.1]
    spec: |-
      Add tests only for invariants marked MISSING. Expose them all through one script, `npm run test:invariants` (it may also call pytest).
      The invariants:
        I-1 Under the stock-only basis (after T-A.5 ships), portfolio company weights + unmapped stock residual = 100% ± 0.01 pt.
        I-2 Pairwise overlap(A,B) = overlap(B,A), and each company term ≤ min(w_A, w_B).
        I-3 overlap + only-A = A's resolved weight (existing test; keep).
        I-4 Core ≤ Broad ≤ company count.
        I-5 The same holdings in Percent mode and Dollars mode give identical company weights (CSV byte-identical).
        I-6 Permuting holding rows changes no output.
        I-7 Fund-of-funds flattening preserves total weight within 1 bp per fund.
        I-8 (after WS-B) An account filter's output equals that account's rows entered alone.
      Tests for I-1 and I-8 are written now and marked skip with the task id that enables them.
    acceptance: ["`npm run test:invariants` passes in CI", "The report lists each invariant with its test name"]
  - id: T-AU-1.3
    phase: A
    kind: BUILD
    title: "Install the workflow"
    approval: PRE_APPROVED
    number_impact: NONE
    depends_on: [T-AU-1.1]
    files_hint: [".github/workflows/math-review.yml", "scripts/review/review.py"]
    spec: |-
      Commit the two provided files unchanged except:
        - replace the placeholder paths in BOTH the pull_request and push lists with the T-AU-1.1 file list
        - set DIFF_PATHS in review.py to the same directories
      If INV-AU-2 shows the nightly jobs live in GitHub Actions, keep math-review as a separate workflow. Do not merge it into the nightly one.
      Do not add the secret or the variable. They are owner steps (see owner_steps).
    acceptance: ["The workflow parses (actionlint, dev only)", "A dry run with OPENROUTER_API_KEY unset fails only at the Model review step"]
  - id: T-AU-1.4
    phase: B
    kind: TEST
    title: "Reference oracle"
    approval: OWNER_REQUIRED
    number_impact: NONE
    prepare: "Nothing to build. The owner has the reviewer model write scripts/review/oracle.py from platform-spec.yaml and this file without seeing app code, then commits it."
    spec: |-
      After the oracle is committed:
        - write docs/platform/fixtures.json (fixture id → holdings array) for FX-1…FX-6
        - make the oracle's output format match the app's CSV export columns
      Do not edit oracle.py logic. If it disagrees with the app, report both values and stop.
    acceptance: ["The oracle step runs in CI", "Every disagreement is listed with fixture, company, app value and oracle value"]

  owner_steps:
    - "Repo → Settings → Secrets and variables → Actions → New secret: OPENROUTER_API_KEY"
    - "Same page → Variables → REVIEW_MODEL = the reviewer model's exact OpenRouter id"
    - "If the model rejects response_format, delete that line in review.py"

# ═══ AU-2 Daily-index extension ══════════════════════════════════════════════
- ws: AU-2
  title: "Pick up money market and fee filings in the nightly index pass"
  tasks:
  - id: T-AU-2.1
    phase: A
    kind: INVESTIGATE
    title: "Daily-index reader"
    approval: PRE_APPROVED
    number_impact: NONE
    spec: "Answer INV-AU-4."
    acceptance: ["Cites file:line"]
  - id: T-AU-2.2
    phase: A
    kind: BACKEND
    title: "N-MFP filings → mmf_aliases"
    approval: PRE_APPROVED
    number_impact: NEW_NUMBERS_ONLY
    depends_on: [T-AU-2.1]
    spec: |-
      In the same daily-index pass, also keep form types N-MFP2, N-MFP3 (and their /A amendments) for any registrant, without the published-registrant filter.
      Extend the registrant set to include those registrants.
      Map series → class tickers with the ticker file the pipeline already uses.
      Write release_files_new.mmf_aliases (platform-spec data_contracts).
      Backfill once: scan daily indexes for the last 70 days, one-off, at the existing request rate.
      No extra requests per night beyond the daily index files already fetched.
    acceptance:
      - "Nightly EDGAR request count unchanged (report before and after)"
      - "VMFXX, SPAXX, FDLXX, SWVXX, VUSXX and FZFXX are present, or each absence is explained"
      - "The validator checks mmf_aliases: no ticker also appears as an N-PORT fund"
  - id: T-AU-2.3
    phase: A
    kind: BACKEND
    title: "Fee-filing discovery list"
    approval: OWNER_REQUIRED
    number_impact: NONE
    depends_on: [T-AU-2.1, T-C.2]
    prepare: "Waits on OD-4 in platform-spec (read fee filings). Show the expected nightly count of 485BPOS, 497 and N-CSR/N-CSRS filings for published registrants (a 30-day sample)."
    spec: |-
      After OD-4 = A, the same pass also keeps 485BPOS, 497, N-CSR, N-CSRS (and /A) for published registrants.
      Write a pending list {accession, form, cik, filed} to the pipeline's work area (not the release).
      T-C.3 consumes this list and fetches only those filings, at most 200 per night (so quarter-end spikes spread over several nights).
      Backfill: the latest prospectus and latest shareholder report per published registrant, once, rate-limited per H9.
    acceptance: ["The pending list is written nightly", "The nightly fetch is capped at 200", "The one-off backfill request count is reported"]

# ═══ AU-3 Refused series ═════════════════════════════════════════════════════
- ws: AU-3
  title: "Who is refused, and why"
  tasks:
  - id: T-AU-3.1
    phase: A
    kind: INVESTIGATE
    title: "Refusal breakdown"
    approval: PRE_APPROVED
    number_impact: NONE
    spec: |-
      Answer INV-AU-5. From the latest refusal log, produce:
        1. Counts by reason code.
        2. The 50 largest refused series by net assets: series_id, name, registrant, reason, NAV, the measured gap (e.g. schedule vs NAV %), and whether a ticker for the series appears in the EDGAR ticker file.
        3. For the top 3 reasons, 3 example filings each, with the specific rows or totals that triggered the refusal.
        4. How many refused series are equity funds (more than 80% EC by row weight, measured before refusal).
      Change no rules.
    acceptance: ["The CSV for item 2 is committed at docs/platform/au3/refused-top50.csv", "Every item is answered"]
  - id: T-AU-3.2
    phase: A
    kind: INVESTIGATE
    title: "Decision pack"
    approval: OWNER_REQUIRED
    number_impact: NONE
    depends_on: [T-AU-3.1]
    prepare: |-
      For each of the top 3 reasons, one of:
        (a) a pipeline bug: the filing is fine and our reading is wrong. Show the fix and the series it would publish.
        (b) a rule worth changing: show the proposed rule, the series it would publish, and what could go wrong.
        (c) a correct refusal: no change.
      Plus a recommendation on a public 'Filed but not published' page: yes or no, and what it would list.
    spec: "Wait for the owner."
    acceptance: ["The owner has answered for each reason"]
